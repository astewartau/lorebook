# Weekly: load new cards from LorcanaJSON into the database's card catalogue,
# then rebuild the site so it ships the same card data.
name: Update card data

on:
  schedule:
    - cron: '41 18 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync the card catalogue
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/cards.mjs fetch
          node scripts/cards.mjs sync
      - name: Rebuild the site
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: env.DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
