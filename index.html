<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Manage your Disney Lorcana TCG collection, build decks, and connect with other players" />
    <link rel="apple-touch-icon" href="/imgs/lorebook-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Set the theme before first paint (see src/app/theme.ts).
      try {
        var t = localStorage.getItem('lorebook-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <title>Lorebook - Disney Lorcana TCG Collection Manager</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
